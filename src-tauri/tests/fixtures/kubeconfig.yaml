apiVersion: v1
kind: Config
current-context: prod
contexts:
  - name: dev
    context:
      cluster: dev-cluster
      user: dev-user
      namespace: default
  - name: prod
    context:
      cluster: prod-cluster
      user: prod-user
clusters:
  - name: dev-cluster
    cluster:
      server: https://dev.example
  - name: prod-cluster
    cluster:
      server: https://prod.example
users:
  - name: dev-user
    user:
      token: dummy
  - name: prod-user
    user:
      token: dummy
